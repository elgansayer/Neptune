[configuration]

aliases/exit = "quit"
aliases/source = "exec"
aliases/usage = "help"
disable_in_release_build = false
print_to_stdout = false
pause_when_open = true

; appearance settings - reduced console size
appearance/custom_theme = "res://addons/limbo_console_theme.tres"
appearance/height_ratio = 0.33
appearance/open_speed = 5.0
appearance/opacity = 0.95
appearance/sparse_mode = false

; greet settings
greet/greet_user = true
greet/greeting_message = "{project_name}"
greet/greet_using_ascii_art = true

; history settings
history/persist_history = true
history/history_lines = 1000

; autocomplete settings
autocomplete/autocomplete_use_history_with_matches = true

; autoexec settings
autoexec/autoexec_script = "user://autoexec.lcs"
autoexec/autoexec_auto_create = true
