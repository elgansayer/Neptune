name: Neptune required tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  merge-gate:
    name: Neptune merge gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Run non-empty applicable tests at the exact head and current base
        run: python3 tools/merge_gate/run.py --evidence "$RUNNER_TEMP/neptune-merge-evidence" --toolchain "$RUNNER_TEMP/neptune-godot"
      - name: Preserve commands, identities and diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neptune-merge-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neptune-merge-evidence
          if-no-files-found: error
          retention-days: 14
