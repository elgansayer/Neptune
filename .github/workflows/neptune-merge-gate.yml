name: Neptune required tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-tests:
    name: Applicable exact-head native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Run non-empty applicable tests at the exact head and current base
        run: python3 tools/merge_gate/run.py --evidence "$RUNNER_TEMP/neptune-merge-evidence" --toolchain "$RUNNER_TEMP/neptune-godot"
      - name: Preserve commands, identities and diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neptune-merge-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/neptune-merge-evidence
          if-no-files-found: error
          retention-days: 14
  web-gameplay:
    uses: ./.github/workflows/web-gameplay.yml
  merge-gate:
    name: Neptune merge gate
    if: always()
    needs: [native-tests, web-gameplay]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require real native and exported browser execution
        env:
          NATIVE_RESULT: ${{ needs.native-tests.result }}
          WEB_RESULT: ${{ needs.web-gameplay.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$WEB_RESULT" = success
