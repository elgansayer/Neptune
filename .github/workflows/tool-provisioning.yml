name: Real tool provisioning

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  applicability:
    name: Determine exact preparation applicability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
      selection_sha256: ${{ steps.select.outputs.selection_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - id: select
        name: Classify complete exact-base/head paths including rename sources
        run: python3 tools/factory/provision_applicability.py plan --report "$RUNNER_TEMP/provision-applicability.json" --github-output "$GITHUB_OUTPUT"
      - name: Preserve applicability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provision-applicability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provision-applicability.json
          if-no-files-found: error
          retention-days: 14
  call-trace:
    needs: applicability
    if: needs.applicability.outputs.required == 'true'
    name: Real matched-core call observer preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Build the matched core and probe its actual bounded ABI
        run: |
          python3 tools/factory/provision.py --tool beetle-saturn-call-trace --cache "$RUNNER_TEMP/call-trace-tools" --evidence "$RUNNER_TEMP/call-trace-evidence/first" --timeout 1500
          python3 tools/factory/provision.py --tool beetle-saturn-call-trace --cache "$RUNNER_TEMP/call-trace-tools" --evidence "$RUNNER_TEMP/call-trace-evidence/reuse" --timeout 60
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          first, again = [json.loads((Path(os.environ['RUNNER_TEMP']) / 'call-trace-evidence' / name / 'report.json').read_text()) for name in ('first', 'reuse')]
          assert first['conclusion'] == again['conclusion'] == 'success'
          assert first['reused'] is False and again['reused'] is True
          assert first['binary_sha256'] == again['binary_sha256']
          assert first['recipe_sha256'] == again['recipe_sha256']
          assert first['smoke'] == again['smoke']
          assert again['smoke']['observer']['rejected_invalid_entry_budget_and_frame'] is True
          assert len(again['commands']) == 2
          PY
      - name: Preserve matched-core preparation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: call-trace-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/call-trace-evidence
          if-no-files-found: error
          retention-days: 14
  context-trace:
    needs: applicability
    if: needs.applicability.outputs.required == 'true'
    name: Real matched-core context observer preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Build the matched core and probe its actual bounded ABI
        run: |
          python3 tools/factory/provision.py --tool beetle-saturn-context-trace --cache "$RUNNER_TEMP/context-trace-tools" --evidence "$RUNNER_TEMP/context-trace-evidence/first" --timeout 1500
          python3 tools/factory/provision.py --tool beetle-saturn-context-trace --cache "$RUNNER_TEMP/context-trace-tools" --evidence "$RUNNER_TEMP/context-trace-evidence/reuse" --timeout 60
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          first, again = [json.loads((Path(os.environ['RUNNER_TEMP']) / 'context-trace-evidence' / name / 'report.json').read_text()) for name in ('first', 'reuse')]
          assert first['conclusion'] == again['conclusion'] == 'success'
          assert first['reused'] is False and again['reused'] is True
          assert first['binary_sha256'] == again['binary_sha256']
          assert first['recipe_sha256'] == again['recipe_sha256']
          assert first['smoke'] == again['smoke']
          assert again['smoke']['observer']['rejected_invalid_profile_budget_witness_and_frame'] is True
          assert len(again['commands']) == 2
          PY
      - name: Preserve matched-core preparation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: context-trace-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/context-trace-evidence
            ${{ runner.temp }}/context-trace-tools/beetle-saturn-context-trace-*/
          if-no-files-found: error
          retention-days: 14
  init-trace:
    needs: applicability
    if: needs.applicability.outputs.required == 'true'
    name: Real matched-core initialization observer preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Build the matched core and probe its actual bounded ABI
        run: |
          python3 tools/factory/provision.py --tool beetle-saturn-init-trace --cache "$RUNNER_TEMP/init-trace-tools" --evidence "$RUNNER_TEMP/init-trace-evidence/first" --timeout 1500
          python3 tools/factory/provision.py --tool beetle-saturn-init-trace --cache "$RUNNER_TEMP/init-trace-tools" --evidence "$RUNNER_TEMP/init-trace-evidence/reuse" --timeout 60
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          first, again = [json.loads((Path(os.environ['RUNNER_TEMP']) / 'init-trace-evidence' / name / 'report.json').read_text()) for name in ('first', 'reuse')]
          assert first['conclusion'] == again['conclusion'] == 'success'
          assert first['reused'] is False and again['reused'] is True
          assert first['binary_sha256'] == again['binary_sha256']
          assert first['recipe_sha256'] == again['recipe_sha256']
          assert first['smoke'] == again['smoke']
          assert again['smoke']['observer']['rejected_invalid_profile_budget_witness_and_frame'] is True
          assert len(again['commands']) == 2
          PY
      - name: Preserve matched-core preparation evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: init-trace-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/init-trace-evidence
            ${{ runner.temp }}/init-trace-tools/beetle-saturn-init-trace-*/
          if-no-files-found: error
          retention-days: 14
  ocr:
    needs: applicability
    if: needs.applicability.outputs.required == 'true'
    name: Real local OCR preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Build pinned OCR and recognise independent public text
        run: |
          python3 tools/factory/provision.py --tool tesseract --cache "$RUNNER_TEMP/ocr-tools" --evidence "$RUNNER_TEMP/ocr-evidence/first" --timeout 1800
          python3 tools/factory/provision.py --tool tesseract --cache "$RUNNER_TEMP/ocr-tools" --evidence "$RUNNER_TEMP/ocr-evidence/reuse" --timeout 60
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          first, again = [json.loads((Path(os.environ['RUNNER_TEMP']) / 'ocr-evidence' / name / 'report.json').read_text()) for name in ('first', 'reuse')]
          assert first['conclusion'] == again['conclusion'] == 'success'
          assert first['reused'] is False and again['reused'] is True
          assert first['binary_sha256'] == again['binary_sha256']
          assert first['recipe_sha256'] == again['recipe_sha256']
          assert first['smoke'] == again['smoke']
          assert again['smoke']['text'] == 'NEPTUNE READY'
          assert len(again['commands']) == 2
          PY
      - name: Preserve OCR installation and recognition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ocr-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ocr-evidence
          if-no-files-found: error
          retention-days: 14
  xvfb:
    needs: applicability
    if: needs.applicability.outputs.required == 'true'
    name: Real unprivileged Xvfb preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: debian:13.7-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4
    steps:
      - name: Prepare dependencies inside disposable CI container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates xserver-common x11-xkb-utils libx11-6 libxfont2 libgl1 libaudit1 libpixman-1-0 libselinux1 libsystemd0 libunwind8 libxau6 libxdmcp6 libnettle8t64
          useradd --create-home --user-group --uid 1001 recipe
          install -d -m 700 -o recipe -g recipe /tmp/xvfb-cache /tmp/xvfb-evidence
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Install, smoke and reuse the real package as an ordinary user
        run: |
          runuser -u recipe -- python3 tools/factory/provision.py --tool xvfb --cache /tmp/xvfb-cache --evidence /tmp/xvfb-evidence/first --timeout 120
          runuser -u recipe -- python3 tools/factory/provision.py --tool xvfb --cache /tmp/xvfb-cache --evidence /tmp/xvfb-evidence/reuse --timeout 60
          python3 - <<'PY'
          import json
          from pathlib import Path
          first, again = [json.loads((Path('/tmp/xvfb-evidence') / name / 'report.json').read_text()) for name in ('first', 'reuse')]
          assert first['conclusion'] == again['conclusion'] == 'success'
          assert first['reused'] is False and again['reused'] is True
          assert first['binary_sha256'] == again['binary_sha256']
          assert first['recipe_sha256'] == again['recipe_sha256']
          assert first['smoke'] == again['smoke']
          assert again['smoke']['pixel'] == 0x123456
          assert len(again['commands']) == 1
          PY
      - name: Preserve graphical preparation evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: xvfb-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/xvfb-evidence
          if-no-files-found: error
          retention-days: 14
  ghidra:
    needs: applicability
    if: needs.applicability.outputs.required == 'true'
    name: Real pinned Ghidra SH-2 preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Install and reuse the actual headless tool with its pinned JDK
        run: |
          python3 tools/factory/provision.py --tool ghidra --cache "$RUNNER_TEMP/ghidra-tools" --evidence "$RUNNER_TEMP/ghidra-evidence/first" --timeout 900
          python3 tools/factory/provision.py --tool ghidra --cache "$RUNNER_TEMP/ghidra-tools" --evidence "$RUNNER_TEMP/ghidra-evidence/reuse" --timeout 180
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          first, again = [json.loads((Path(os.environ['RUNNER_TEMP']) / 'ghidra-evidence' / name / 'report.json').read_text()) for name in ('first', 'reuse')]
          assert first['conclusion'] == again['conclusion'] == 'success'
          assert first['reused'] is False and again['reused'] is True
          assert first['binary_sha256'] == again['binary_sha256']
          assert first['recipe_sha256'] == again['recipe_sha256']
          assert first['smoke'] == again['smoke']
          assert again['smoke']['language'] == 'SuperH:BE:32:SH-2'
          assert again['smoke']['constant_return'] == 42
          assert len(again['commands']) == 2
          PYTHON
      - name: Prove changed fixture bytes cannot pass the actual headless smoke
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('tools/factory').absolute()))
          import provision as p
          import provision_ghidra as g
          temp = Path(os.environ['RUNNER_TEMP'])
          first = json.loads((temp / 'ghidra-evidence/first/report.json').read_text())
          evidence = temp / 'ghidra-evidence/mutation'
          evidence.mkdir()
          recipe = p.identity('ghidra', p.ROOT)[0]
          report = {'commands': []}
          import time
          runner = p.Runner(evidence, report, evidence, time.monotonic() + 150)
          g.FIXTURE = bytes.fromhex('e02b000b0009')
          try:
              g.smoke(recipe, Path(first['binary']), runner, p.ROOT)
          except (ValueError, OSError) as error:
              log = evidence / report['commands'][-1]['log']
              assert 'Wrong constant/register decoding' in log.read_text(), 'Negative control failed for an unrelated reason'
              assert not (evidence / 'ghidra-public-sh2.json').exists()
              (evidence / 'rejected.json').write_text(json.dumps({'rejected': True, 'error': str(error)}))
          else:
              raise SystemExit('Changed SH-2 immediate falsely passed')
          PYTHON
      - name: Preserve headless installation, reuse and negative-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghidra-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ghidra-evidence
          if-no-files-found: error
          retention-days: 14
  install:
    name: Pinned Godot and Saturn installation
    needs: [applicability, xvfb, ocr, call-trace, context-trace, init-trace, ghidra]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Reject missing, stale, skipped or failed applicable dependencies
        env:
          NEPTUNE_PROVISION_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/factory/provision_applicability.py assert-needs --report "$RUNNER_TEMP/provision-dependencies.json"
      - name: Install real tools into a fresh disposable cache
        if: needs.applicability.outputs.required == 'true'
        run: |
          python3 tools/factory/provision.py --tool godot --cache "$RUNNER_TEMP/prepared-tools" --evidence "$RUNNER_TEMP/provision-evidence/godot-first" --timeout 300
          python3 tools/factory/provision.py --tool beetle-saturn --cache "$RUNNER_TEMP/prepared-tools" --evidence "$RUNNER_TEMP/provision-evidence/saturn-first" --timeout 1200
      - name: Reuse and recheck without another build or download
        if: needs.applicability.outputs.required == 'true'
        run: |
          python3 tools/factory/provision.py --tool godot --cache "$RUNNER_TEMP/prepared-tools" --evidence "$RUNNER_TEMP/provision-evidence/godot-reuse" --timeout 60
          python3 tools/factory/provision.py --tool beetle-saturn --cache "$RUNNER_TEMP/prepared-tools" --evidence "$RUNNER_TEMP/provision-evidence/saturn-reuse" --timeout 60
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'provision-evidence'
          for tool in ('godot', 'saturn'):
              first = json.loads((root / (tool + '-first') / 'report.json').read_text())
              again = json.loads((root / (tool + '-reuse') / 'report.json').read_text())
              assert first['conclusion'] == again['conclusion'] == 'success'
              assert first['reused'] is False and again['reused'] is True
              assert first['binary_sha256'] == again['binary_sha256']
              assert first['recipe_sha256'] == again['recipe_sha256']
              assert len(again['commands']) == 1, 'Reuse must run only the real smoke check'
          print('Real installers and idempotent reuse passed; no game or BIOS was loaded.')
          PY
      - name: Preserve logs and receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/provision-dependencies.json
            ${{ runner.temp }}/provision-evidence
          if-no-files-found: error
          retention-days: 14
