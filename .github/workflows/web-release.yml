name: Web release
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/web/**
      - .github/workflows/web-release.yml
      - export_presets.cfg
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned Godot and export templates
        run: |
          python3 tools/godot/install.py --directory "$RUNNER_TEMP/godot"
          python3 tools/godot/install_templates.py --directory "$HOME/.local/share/godot/export_templates"
          python3 -c 'import json; print("GODOT_BINARY=" + json.load(open("tools/godot/toolchain.json"))["binary_name"])' >> "$GITHUB_ENV"
      - name: Import and export current project
        run: python3 deploy/web/export.py --godot "$RUNNER_TEMP/godot/$GODOT_BINARY"
      - name: Verify transport configuration contracts
        run: bash run_bot_tests.sh --godot "$RUNNER_TEMP/godot/$GODOT_BINARY" --run-specific test_web_transport
      - name: Build serving image
        run: |
          docker build -f deploy/web/Dockerfile -t neptune-web-candidate .
          docker build -f deploy/web/Dockerfile.server -t neptune-server-candidate .
      - name: Exercise real browser startup
        run: |
          docker network create neptune-smoke
          docker run -d --name server-candidate --network neptune-smoke --network-alias server neptune-server-candidate
          docker run -d --name web-candidate --network neptune-smoke -p 127.0.0.1:8765:80 neptune-web-candidate
          mkdir -p "$RUNNER_TEMP/web-smoke"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/healthz
          cp deploy/web/smoke.mjs "$RUNNER_TEMP/web-smoke/"
          cd "$RUNNER_TEMP/web-smoke"
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium
          node smoke.mjs
      - name: Collect real server diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/web-smoke"
          docker logs server-candidate > "$RUNNER_TEMP/web-smoke/server.log" 2>&1 || true
          docker logs web-candidate > "$RUNNER_TEMP/web-smoke/web.log" 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: web-startup-evidence
          path: |
            ${{ runner.temp }}/web-smoke/browser-startup.png
            ${{ runner.temp }}/web-smoke/server.log
            ${{ runner.temp }}/web-smoke/web.log
          if-no-files-found: warn
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        run: |
          image=ghcr.io/elgansayer/neptune-bomberman-web
          docker tag neptune-web-candidate "$image:sha-$GITHUB_SHA"
          docker tag neptune-web-candidate "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
          image=ghcr.io/elgansayer/neptune-bomberman-server
          docker tag neptune-server-candidate "$image:sha-$GITHUB_SHA"
          docker tag neptune-server-candidate "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Notify Arcane after image publication
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_RESOLVE: ${{ vars.DEPLOY_RESOLVE }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_WEBHOOK_URL" || { echo "DEPLOY_WEBHOOK_URL is missing" >&2; exit 1; }
          status=$(curl --silent --show-error --output /tmp/deploy.json --write-out '%{http_code}' --max-time 90 --resolve "$DEPLOY_RESOLVE" --request POST "$DEPLOY_WEBHOOK_URL")
          test "$status" = 202 || { echo "Deployment trigger returned HTTP $status" >&2; exit 1; }
          echo "Arcane accepted deployment. Check the project's Event Log for the rollout result."
