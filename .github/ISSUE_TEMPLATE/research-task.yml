name: Research or factory task
description: A bounded task with dependencies, evidence and acceptance checks
title: '[Research] '
body:
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: What must demonstrably work? State the scope and exclusions.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and prerequisites
      description: Link blocking issues and required private inputs; never attach credentials or disc images.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reference evidence
      description: Input lock hash, emulator build, scenario, capture IDs, confidence and known unknowns.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Commands, expected observable results and failure cases. Missing evidence must fail.
    validations:
      required: true
